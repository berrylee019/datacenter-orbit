name: 🌐 Automated Global Infra Agent Pipeline

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4
      with:
        persist-credentials: true  # 🔑 쓰기 권한 토큰을 깃 명령에 완벽 동기화

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Ensure data.json integrity
      run: |
        if [ ! -f data.json ] || [ ! -s data.json ]; then
          echo "[]" > data.json
        fi

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install openai geopy

    - name: Run Global Infra Agent
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        python agent.py

    # 🔑 [최종 솔루션] 변경 감지 필터를 걷어내고, 무조건 강제로 덮어씌워 push 합니다.
    - name: Force Commit and Push data.json
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # 안전하게 원격 브랜치 최신 상태 한번 가져오기
        git pull origin main
        
        # 파일 강제 스테이징 및 커밋
        git add data.json
        
        # 무조건 커밋을 유도하기 위해 날짜 스탬프를 가미한 메시지 처리
        git commit -m "chore: forced telemetry infrastructure sync $(date +'%Y-%m-%d %H:%M:%S') [skip ci]" || echo "No changes to commit"
        
        # 메인 브랜치로 무조건 밀어 올리기
        git push origin main
