name: 🌐 Automated Global Infra Agent Pipeline

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

# 💡 [경고 해결] 가상 서버 전체에 Node.js 24 엔진 강제 적용 환경변수 주입
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# 🔑 [최종 열쇠] GitHub Actions 토큰에 리포지토리 쓰기 권한을 강제로 부여합니다.
permissions:
  contents: write
  
jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 💡 [안전 장치] 만약 data.json이 없거나 비어 있으면 가상 서버가 터지지 않게 빈 배열([])로 초기화
    - name: Ensure data.json integrity
      run: |
        if [ ! -f data.json ] || [ ! -s data.json ]; then
          echo "[]" > data.json
          echo "⚠️ data.json initialized as empty array to prevent parse errors."
        fi


    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install openai geopy

    - name: Run Global Infra Agent
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        python agent.py

    - name: Commit and Push if data.json changed
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        git add data.json
        if git diff --staged --quiet; then
          echo "No changes in data.json. Skipping push."
        else
          git commit -m "chore: automated telemetry infrastructure update [skip ci]"
          git push origin main
        fi
